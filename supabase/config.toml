# Yerel Supabase yapılandırması (supabase start / db reset için)
# Bulut projesi kapalı olduğundan geliştirme ve demo tamamen yerelde çalışabilir.
project_id = "enocnbkwemlgvdgafmpa"

# NOT: Portlar bilinçli olarak 553xx aralığında. Bu makinede başka Supabase
# projeleri varsayılan 5432x portlarını (54321 Kong) kullanabildiği için
# çakışmayı önlemek adına ayrı aralık seçildi. `scripts/db.mjs` portları bu
# dosyadan okur ve .env.local'i buna göre yazar.
[api]
enabled = true
port = 55321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 15

[db.pooler]
enabled = false

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 55323

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Yerelde e-posta doğrulaması kapalı: admin kullanıcısı hemen giriş yapabilsin.
enable_confirmations = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
